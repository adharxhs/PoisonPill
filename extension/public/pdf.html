<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan a PDF · PoisonPill</title>
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="pdf-page.js"></script>
  </head>
  <body class="pdf-page">
    <header>
      <img src="icons/icon-128.png" alt="" />
      <div>
        <h1>PoisonPill</h1>
        <p>Local legal shield</p>
      </div>
    </header>

    <main>
      <section class="card file-picker" aria-labelledby="scan-title">
        <div>
          <h2 id="scan-title">Scan a PDF</h2>
          <p id="file-help">Choose a PDF with selectable text, up to 20 MB.</p>
        </div>
        <label class="file-button">
          <span id="choose-pdf">Choose PDF</span>
          <input id="file" type="file" accept=".pdf,application/pdf" aria-labelledby="choose-pdf" aria-describedby="file-help" />
        </label>
        <p id="status" role="status"></p>
      </section>

      <div id="result" hidden>
        <section id="summary" class="card score-card">
          <div class="gauge" role="meter" aria-label="Poison index" aria-valuemin="0" aria-valuemax="100">
            <svg viewBox="0 0 220 120" aria-hidden="true">
              <defs>
                <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#22c55e" />
                  <stop offset="0.25" stop-color="#eab308" />
                  <stop offset="0.5" stop-color="#f97316" />
                  <stop offset="0.75" stop-color="#ef4444" />
                  <stop offset="1" stop-color="#be123c" />
                </linearGradient>
              </defs>
              <path class="track" d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="url(#risk)" stroke-width="14" stroke-linecap="round" />
              <path id="gauge-fill" class="fill" d="M 20 110 A 90 90 0 0 1 200 110" pathLength="100"
                    fill="none" stroke="url(#risk)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 100" />
              <circle id="gauge-knob" class="knob" cx="20" cy="110" r="8" />
            </svg>
            <div class="readout">
              <strong id="poison-index">--</strong>
              <span>Poison index</span>
            </div>
          </div>
          <span id="band" class="pill"></span>
          <p id="verdict" class="verdict"></p>
          <p class="source">
            <b id="source-name"></b>
            <time id="scanned-at"></time>
          </p>
        </section>

        <div class="actions">
          <button id="download" type="button">Download PDF report</button>
        </div>
        <section id="empty" class="card empty" hidden>
          <h2>No predatory clauses found</h2>
          <p>The scanned text produced no findings for the currently supported rules.</p>
        </section>
        <div id="report"></div>
      </div>
    </main>

    <footer>Analysed on this device. Nothing leaves your browser.</footer>
  </body>
</html>
