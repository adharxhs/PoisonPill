[package]
name = "poisonpill-engine"
version = "0.1.0"
edition = "2021"
description = "Deontic dependency-graph parser for predatory contract clauses"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The wasm-opt bundled with wasm-pack 0.15 predates bulk-memory support in the
# current Rust wasm backend and rejects our module. The module is already built
# with opt-level="z" + LTO; the budget is asserted in `make verify`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
